# sysone tolerances (DESIGN.md §9.2). Every test reads its thresholds here; loosening one is a reviewed
# one-line change. Generated by reference/noise_stats.py --write-tolerances from the W1b dev goldens;
# hand edits are fine but must keep the measured_* numbers they derive from.
#
# Rule (relative, binding): a threshold is FACTOR x the envelope the *reference itself* shows, where the
# envelope is the largest measured spread among the named reference-vs-reference comparisons:
#   bf16_vs_fp32      qev bf16 vs qev fp32 (same fork path), pooled over batched and sequential
#   bf16_fork         qev bf16 batched fork vs sequential branches (batch-dependent kernel rounding)
#   nvfp4_cross_process  NVFP4 QDQ per-question reference, 3 fresh processes, pairwise
#   nvfp4_perq_vs_shared_prefix  NVFP4 QDQ per-question vs the shared-prefix served path (batched+seq)
# Probabilities are per option of each branch (softmax of the slot logits at T = 1); dp = |p_a - p_b|.
# Quantiles are nearest-rank over all options of all compared branches. Tests must still print their
# own p50/p99/max, not just pass/fail.

schema = 1
generated = "2026-11-13"
source = "tests/golden/dev/model/noise_report.json"
tier = "dev (GB10 aarch64, torch 2.13.0+cu132, transformers 5.19.0, torch-fallback GDN, sdpa)"
factor = 1.5


# sysone bf16 vs the bf16 reference (qev batched): slot logits and per-option probabilities.
# top1_margin: the top choice must agree wherever the reference's top-1 margin exceeds it.
# It is max(FACTOR x measured_top1_margin, floor_top1_margin): the largest reference margin at
# which any reference pair in the envelope flipped its top choice, x FACTOR, but never below
# the DESIGN §9.2 starting value (floor), because a handful of flips over the dev corpus is too
# few to bound the flip margin tightly.
[e2e.bf16]
envelope = "bf16_vs_fp32+bf16_fork"
dp_p99 = 0.01846
measured_dp_p99 = 0.01231  # bf16_vs_fp32: dp_option p99
dp_max = 0.04241
measured_dp_max = 0.02827  # bf16_vs_fp32: dp_option max
dlogit_p99 = 0.1201
measured_dlogit_p99 = 0.08008  # bf16_vs_fp32: dlogit p99
dlogit_max = 0.2842
measured_dlogit_max = 0.1895  # bf16_vs_fp32: dlogit max
top1_margin = 0.02
measured_top1_margin = 0.0009277  # bf16_vs_fp32+bf16_fork: top1_flip_max_ref_margin
floor_top1_margin = 0.02  # DESIGN §9.2 starting value
# flips summed over the envelope's pairs (the same branch can flip in several pairs)
measured_top1_flips = 2
design_start_dp_p99 = 0.01
design_start_dp_max = 0.05

# sysone (bf16) vs the fp32 reference: within FACTOR x the bf16 reference's own error vs
# fp32.
[e2e.fp32_truth]
envelope = "bf16_vs_fp32"
dp_p99 = 0.01846
measured_dp_p99 = 0.01231  # bf16_vs_fp32: dp_option p99
dp_max = 0.04241
measured_dp_max = 0.02827  # bf16_vs_fp32: dp_option max
dlogit_p99 = 0.1201
measured_dlogit_p99 = 0.08008  # bf16_vs_fp32: dlogit p99
dlogit_max = 0.2842
measured_dlogit_max = 0.1895  # bf16_vs_fp32: dlogit max

# The same request alone vs packed with 63 others (sysone vs itself). Envelope: the
# reference's own batch dependence (batched fork vs sequential).
[batch_invariance]
envelope = "bf16_fork"
dp_max = 0.01822
measured_dp_max = 0.01215  # bf16_fork: dp_option max
dlogit_max = 0.1816
measured_dlogit_max = 0.1211  # bf16_fork: dlogit max
design_start_dp_max = 0.01

# sysone NVFP4 vs the NVFP4 QDQ per-question reference (not bf16): within its own run-to-run
# drift and its per-question vs shared-prefix spread (DESIGN §3.1, §9.2).
# Measured: cross-process drift on this box is 0.0 (deterministic torch-fallback GDN), but the
# per-question and shared-prefix paths differ ~10x more than in bf16: FP4 activation rounding
# amplifies bf16 kernel-shape noise (see noise_report.json hidden.*_served_vs_per_question). The
# §3.1 equivalence holds in exact arithmetic only, so this gate is wide; tighten it by comparing
# sysone against the shared-prefix QDQ path once W4 can run the same packing.
[nvfp4]
envelope = "nvfp4_cross_process+nvfp4_perq_vs_shared_prefix"
dp_p99 = 0.1956
measured_dp_p99 = 0.1304  # nvfp4_perq_vs_shared_prefix: dp_option p99
dp_max = 0.3488
measured_dp_max = 0.2325  # nvfp4_perq_vs_shared_prefix: dp_option max
dlogit_p99 = 1.326
measured_dlogit_p99 = 0.8841  # nvfp4_perq_vs_shared_prefix: dlogit p99
dlogit_max = 1.861
measured_dlogit_max = 1.241  # nvfp4_perq_vs_shared_prefix: dlogit max

# Quality information only (no gate): NVFP4 QDQ vs bf16, same paths.
[nvfp4.vs_bf16]
measured_dp_p50 = 0.004051
measured_dp_p99 = 0.1694
measured_dp_max = 0.3141
measured_top1_flips = 16

# [kernels.*]: per-op tolerances belong to W3's kernel tests (fp32 torch reference per op, §9.2);
# add them here as [kernels.<op>] tables with the measurement each derives from.

# >>> [eval] generated by reference/eval/stats.py --write-tolerances (do not edit by hand) >>>
# Statistical end-to-end gates on the labeled eval set (DESIGN §9.2; reference/eval/README.md).
# Set: tests/golden/dev/eval/set.json (278 labeled records = 278 labeled + 556 support questions; requests sha256 bff2bad6c8b6af18).
# Envelope = worst value over all pairs of the tier's reference paths; limit = max(factor x measured, floor)
# rounded UP to 6 significant digits (measured_ and floor_ are written at full precision).
# A candidate passes iff, against EVERY reference path of the tier: disagree, dp_mean, dp_p99 <= limit;
# the paired-bootstrap (B=10000, records) 95% CI lower bound of acc(candidate) - acc(ref) >= -acc_drop;
# the paired-bootstrap 95% CI upper bound of Brier(candidate) - Brier(ref) <= brier_rise.
# disagree counts top-1 changes over all questions where the reference's top-1 margin > disagree_margin
# (nvfp4: 0 = every question; bf16: [e2e.bf16].top1_margin, DESIGN 9.2's allowance for near-tie flips).
# dp is per option of every question (answer level); acc and Brier are over the labeled questions.
# bf16 paths include fp32_batched: DESIGN 9.2 bounds the error by the bf16 reference's own error vs fp32.
# floor_disagree = 2 questions of the set. floor_acc_drop is on the CI scale: -(CI lower bound) of a
# candidate one labeled loss (or one loss + one gain) away from the reference, computed exactly.

[eval.nvfp4]
paths = "nvfp4_perq+nvfp4_perq_bN+nvfp4_batched+nvfp4_sequential"
disagree_margin = 0.0  # every question counts
disagree = 0.041367
measured_disagree = 0.027577937649880094  # nvfp4_perq_bN~nvfp4_sequential
floor_disagree = 0.002398081534772182
dp_mean = 0.00281023
measured_dp_mean = 0.0018734831772602967  # nvfp4_perq_bN~nvfp4_sequential
dp_p99 = 0.0785671
measured_dp_p99 = 0.05237800000000001  # nvfp4_perq_bN~nvfp4_sequential
acc_drop = 0.0431655
measured_acc_drop = 0.02877697841726619  # nvfp4_perq~nvfp4_batched
floor_acc_drop = 0.01079136690647482
brier_rise = 0.0318085
measured_brier_rise = 0.021205613565938843  # nvfp4_perq~nvfp4_sequential

[eval.bf16]
paths = "bf16_batched+bf16_sequential+bf16_perq+fp32_batched"
disagree_margin = 0.02  # = [e2e.bf16].top1_margin
disagree = 0.00239809
measured_disagree = 0.0  # bf16_batched~bf16_sequential
floor_disagree = 0.002398081534772182
dp_mean = 0.000220301
measured_dp_mean = 0.00014686719980111054  # bf16_sequential~bf16_perq
dp_p99 = 0.00582
measured_dp_p99 = 0.0038799999999999946  # bf16_sequential~bf16_perq
acc_drop = 0.0107914
measured_acc_drop = 0.0  # bf16_batched~bf16_sequential
floor_acc_drop = 0.01079136690647482
brier_rise = 0.00236366
measured_brier_rise = 0.0015757684026510815  # bf16_batched~bf16_sequential
# <<< [eval] end <<<

# >>> [model.hidden] generated by reference/hidden_dense.py gate --write-tolerances (do not edit by hand) >>>
# Per-layer hidden states (DESIGN §9.2 Model, gate (a)): relative error e(r) = ||h - h_fp32|| / ||h_fp32|| per
# row vs the qev fp32 served path, compared with the bf16 served reference's own error on the SAME rows.
# Row set (3829 rows per tap): per dump_hidden request: prefix rows {0, s, 2s, ...} | {P-2, P-1} with s = max(1, P // 1024), then every branch's answer row (last suffix token), in suffix order; requests sorted by id.
# Dumps: tests/golden/dev/model/hidden_dense_manifest.json; validation: hidden_gate_report.json.
# Per tap, a candidate passes iff (i) p99(e_c) <= rel_p99 = factor x measured_rel_p99 (the reference's p99
# on these rows; max is reported, not gated); (ii) the lower median over rows of log(e_c / e_b) is at most
# log(paired_ratio); (iii) with n_up = #{e_c > sign_ratio x e_b} and n_down = #{e_b > sign_ratio x e_c},
# deflated by the tap's design effect D (k = floor(n / D + 1/2)), the one-sided exact binomial
# p = P(X >= k_up | Binomial(k_up + k_down, 1/2)) is at least sign_alpha.
# D = max(factor x measured_sign_design_effect, 1): rows of one request move together, so row signs are
# over-dispersed; measured = the largest request-clustered dispersion sum_u (net_u)^2 / sum_u discordant_u
# over every ordered pair of five bf16 realizations of the reference (served, per-question, three
# hidden-basis permutations). Without it the plain row binomial fails equivalent bf16 realizations
# (p down to 3.6e-4 at layer31/norm). The validation report lists the plain row p as sign_p_rows.
# How the criteria combine: 6 taps x 3 criteria, each evaluated on its own (the sign test at sign_alpha per
# tap); a candidate fails gate (a) if any criterion fails on any tap. No multiple-testing correction is made,
# which is conservative (against the candidate): for an equivalent implementation the 6 sign tests alone
# allow a family-wise false-fail rate of up to ~6%. The sign test is sensitive to the 1.5x margin on D:
# sysone bf16 (Phase 2a A1) passes the norm tap at p = 0.038 with D = 18.42; with D = 1.0 x measured (12.28)
# it would be p = 0.011, just above alpha (layer31: 0.067 -> 0.029). The norm verdict sits close to the margin.
[model.hidden]
rowset = "dense_v1"
rows_min = 1000
paired_ratio = 1.5
sign_ratio = 1.5
sign_alpha = 0.01
