[package]
name = "sysone"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Inference server for System One decision models (elephant-1) on cuda-rust"
autobins = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
half = "2"

# Frontend (DESIGN.md §7, W2): tokenizer.json via HF tokenizers (the 0.23 line, like the reference's Python
# tokenizers 0.23.3, with onig regex like the Python wheel), chat_template.jinja via minijinja with Python string
# methods (pycompat), sha256 for the qev meta `prompt_sha256`, and Unicode categories for Python's
# `str.isprintable` (the `repr` in qev's 404 message).
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
minijinja = { version = "2.24", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
sha2 = "0.10"
unicode-general-category = "1"
# Shortest round-trip float digits with ties to even, as Python's repr(float) picks them (Rust's `{:e}` breaks
# ties upward).
ryu = "1"

# Server (DESIGN.md §7, W5): axum 0.8 (its router treats `:` as a literal, so `/v1/systemone:batch` routes), and
# hyper's HTTP/1 client for the end-to-end tests and the load generator.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# cuda-rust, by path (DESIGN.md §1). Versions are exact-pinned upstream.
cuda-core = { path = "../cuda-rust/cuda-core" }
cuda-async = { path = "../cuda-rust/cuda-async" }
cutile = { path = "../cuda-rust/cutile-rs/cutile", features = ["experimental-tune"] }
cutile-kernels = { path = "../cuda-rust/cutile-rs/cutile-kernels" }

# cuBLAS(Lt) bf16 GEMM baseline (DESIGN.md §6.4) and the hardware probe.
# `cuda-13000` selects cudarc's driver-API symbol set, so it must match the *minimum supported driver*
# (R580 = CUDA 13.0, docs/PLATFORM.md), not the toolkit: cudarc resolves every driver symbol at load and
# panics on R580 with `cuda-13010`. The engine uses cuda-core for contexts and streams and cudarc only
# for cuBLAS handles.
cudarc = { version = "0.19.2", default-features = false, features = ["std", "cublas", "cublaslt", "f16", "dynamic-loading", "cuda-13000"] }
rayon = "1.12.0"
memmap2 = "0.9.12"

# build.rs embeds the checked-in cuda-oxide PTX of kernels-simt/ after checking its hashes (docs/G1.md).
[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "sysone"
path = "src/main.rs"

[[bin]]
name = "loadgen"
path = "benchmarks/s1/loadgen.rs"

[[bin]]
name = "hwprobe"
path = "benchmarks/s1/hwprobe.rs"

[[bin]]
name = "tile_gemm_probe"
path = "benchmarks/s1/tile_gemm_probe.rs"

[[bin]]
name = "bench_gdn"
path = "benchmarks/s1/bench_gdn.rs"

[[bin]]
name = "bench_attn"
path = "benchmarks/s1/bench_attn.rs"

[[bin]]
name = "bench_nvfp4"
path = "benchmarks/s1/bench_nvfp4.rs"

[[bin]]
name = "cpu_ref_check"
path = "src/engine/cpu_ref/check_main.rs"

[[bin]]
name = "bench_forward"
path = "benchmarks/s1/bench_forward.rs"

[[bin]]
name = "bench_exact"
path = "benchmarks/s1/bench_exact.rs"

[[bin]]
name = "bench_warmup_v2"
path = "benchmarks/s1/bench_warmup_v2.rs"
